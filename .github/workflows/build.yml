name: Build and publish

on:
  schedule:
    - cron: "17 * * * *"     # every hour at :17 (UTC)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]          # rebuild whenever you edit feeds or the template

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4      # keeps the last good copy of each feed between runs
        with:
          path: .cache
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
